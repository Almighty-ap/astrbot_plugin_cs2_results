[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "data", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B008"]
